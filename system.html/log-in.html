<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WasteLess</title>
</head>
<body>
    
    <section>
        <div>
            
            <div>
                <h2>LOG-IN</h2>
                <hr>
            </div>

            <form id="loginForm" method="" action="">
                <div>
                    <label for="loginEmail">Email Address:</label>
                    <input type="email" id="loginEmail" name="email" required>
                </div>

                <div>
                    <label for="loginPassword">Password:</label>
                    <input type="password" id="loginPassword" name="password" required>
                </div>

                <div>
                    <button type="submit" name="role" value="vendor">Log In as Vendor</button>
                    <button type="submit" name="role" value="admin">Log In as Admin</button>
                </div>

                <hr>

                <div>
                    <button type="button" onclick="window.location.href='register.html'">Register</button>
                </div>

                <div id="loginFeedback"></div>
            </form>

        </div>
    </section>

    <footer>
        <p>&copy; 2026 WasteLess. All rights reserved.</p>
    </footer>

    <script src="../system.js/login.js"></script>
</body>
</html>
